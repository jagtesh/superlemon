# Canonical issue-label taxonomy. Keep issue-form `labels` entries in sync.
- name: "kind: feedback"
  color: "6f42c1"
  description: "A report about the experience of using Superlemon."
- name: "kind: proposal"
  color: "1d76db"
  description: "A product or feature direction proposed for discussion."
- name: "kind: bug"
  color: "d73a4a"
  description: "Reproducible behavior that appears incorrect."
- name: "status: needs discussion"
  color: "fbca04"
  description: "The problem or direction needs discussion before implementation."
- name: "status: ready for PR"
  color: "0e8a16"
  description: "The direction is agreed and a pull request is invited."
- name: "status: blocked"
  color: "b60205"
  description: "Progress depends on a decision or external change."
- name: "area: editor"
  color: "c5def5"
  description: "Neovim grid rendering, input, scrolling, or editing experience."
- name: "area: native UI"
  color: "c5def5"
  description: "AppKit chrome, panels, menus, sidebar, tabs, or settings."
- name: "area: Neovim"
  color: "c5def5"
  description: "Neovim integration, runtime configuration, RPC, or plugins."
- name: "area: performance"
  color: "c5def5"
  description: "Latency, responsiveness, resource usage, or rendering performance."
- name: "area: docs"
  color: "c5def5"
  description: "Documentation or contributor guidance."
