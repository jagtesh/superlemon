name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels:
  - "kind: bug"
  - "status: needs discussion"
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.x
    validations:
      required: true
  - type: input
    id: neovim
    attributes:
      label: Neovim version
      placeholder: NVIM v0.12.x
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or recordings
      description: Attach anything useful after removing secrets and private information.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and private information from the report.
          required: true
