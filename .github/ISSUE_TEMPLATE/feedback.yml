name: Experience feedback
description: Tell us what you liked, disliked, or would improve.
title: "[Feedback]: "
labels:
  - "kind: feedback"
  - "status: needs discussion"
body:
  - type: markdown
    attributes:
      value: |
        Honest experience reports matter more than code. Thank you for helping shape Superlemon.
  - type: textarea
    id: context
    attributes:
      label: What were you trying to do?
      description: Describe the workflow or goal that gave rise to this feedback.
      placeholder: I was trying to...
    validations:
      required: true
  - type: textarea
    id: liked
    attributes:
      label: What did you like?
      placeholder: This worked or felt good because...
    validations:
      required: true
  - type: textarea
    id: disliked
    attributes:
      label: What did you not like?
      placeholder: This was confusing, slow, awkward, or frustrating because...
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What would make it better for you?
      description: Outcomes and examples are more useful than implementation instructions.
      placeholder: I would find this better if...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your macOS and Neovim versions when relevant.
      placeholder: macOS 15.x, Neovim 0.12.x
