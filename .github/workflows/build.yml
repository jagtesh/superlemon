name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Install Neovim
        run: brew install neovim

      - name: Build
        run: swift build

      - name: Test Swift packages
        run: swift test

      - name: Test Neovim runtime
        run: bash runtime/tests/run.sh

      - name: Package application
        run: scripts/package-app.sh release

      - name: Prepare artifact
        id: artifact
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          archive="dist/Superlemon-${version}-macOS.zip"
          ditto -c -k --keepParent dist/Superlemon.app "$archive"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superlemon-${{ steps.artifact.outputs.version }}-macOS
          path: ${{ steps.artifact.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.archive }}" \
            --verify-tag \
            --generate-notes \
            --title "Superlemon ${{ steps.artifact.outputs.version }}"
