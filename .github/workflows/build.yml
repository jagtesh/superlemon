name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      archive_name: ${{ steps.artifact.outputs.archive_name }}
      version: ${{ steps.artifact.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # version.sh needs tags and full history for bundle versions

      - name: Verify runner and dependency manifest
        run: |
          test "$(uname -m)" = arm64
          scripts/verify-dependencies.sh

      - name: Test archive extraction boundary validation
        run: python3 scripts/tests/validate_tar_archive_tests.py

      - name: Test release acceptance validation
        run: python3 scripts/tests/validate_release_acceptance_tests.py

      - name: Show toolchain
        run: swift --version

      - name: Prepare checksum-verified Neovim
        run: |
          nvim_distribution=$(scripts/fetch-neovim.sh)
          echo "$nvim_distribution/bin" >> "$GITHUB_PATH"
          echo "SUPERLEMON_NVIM=$nvim_distribution/bin/nvim" >> "$GITHUB_ENV"
          echo "SUPERLEMON_NVIM_DIST=$nvim_distribution" >> "$GITHUB_ENV"

      - name: Build
        run: swift build

      - name: Test all Swift packages
        env:
          # Runners enable Reduce Motion, which silently disables the
          # animation paths the SurfaceKit behavior tests exercise.
          SUPERLEMON_REDUCE_MOTION: "0"
        run: swift test

      - name: Test Neovim runtime
        run: bash runtime/tests/run.sh

      - name: Package ad-hoc-signed test application
        env:
          SUPERLEMON_SIGNING_MODE: adhoc
        run: scripts/package-app.sh release

      - name: Verify packaged application
        run: scripts/verify-package.sh dist/Superlemon.app

      - name: Smoke-test packaged application in clean state
        shell: bash
        run: |
          state=$(mktemp -d)
          trap 'rm -rf "$state"' EXIT
          mkdir -p "$state/home" "$state/config" "$state/data" "$state/state" "$state/cache"
          HOME="$state/home" \
          XDG_CONFIG_HOME="$state/config" \
          XDG_DATA_HOME="$state/data" \
          XDG_STATE_HOME="$state/state" \
          XDG_CACHE_HOME="$state/cache" \
            dist/Superlemon.app/Contents/MacOS/superlemon --smoke

      - name: Prepare arm64 test artifact
        id: artifact
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          artifact_name="Superlemon-${version}-macOS-arm64-unsigned"
          archive_name="${artifact_name}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Superlemon.app "dist/$archive_name"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload tested artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: dist/${{ steps.artifact.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      needs.build-test-package.result == 'success'
    needs: build-test-package
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out exact tagged source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download exact tested application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-test-package.outputs.artifact_name }}
          path: dist-release

      - name: Expand tested application
        run: |
          ditto -x -k \
            "dist-release/${{ needs.build-test-package.outputs.archive_name }}" \
            dist-release/app

      - name: Import protected Developer ID identity
        env:
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          test -n "$SIGNING_CERTIFICATE"
          test -n "$SIGNING_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          test -n "$NOTARY_KEY"
          keychain="$RUNNER_TEMP/superlemon.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "SUPERLEMON_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Apply hardened Developer ID signatures
        env:
          SUPERLEMON_SIGNING_MODE: developer-id
        run: scripts/sign-app.sh dist-release/app/Superlemon.app

      - name: Verify signed application and runtime readiness
        run: |
          scripts/verify-package.sh dist-release/app/Superlemon.app
          state=$(mktemp -d)
          trap 'rm -rf "$state"' EXIT
          mkdir -p "$state/home" "$state/config" "$state/data" "$state/state" "$state/cache"
          HOME="$state/home" \
          XDG_CONFIG_HOME="$state/config" \
          XDG_DATA_HOME="$state/data" \
          XDG_STATE_HOME="$state/state" \
          XDG_CACHE_HOME="$state/cache" \
            dist-release/app/Superlemon.app/Contents/MacOS/superlemon --smoke

      - name: Notarize, staple, and archive
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          scripts/notarize-app.sh \
            dist-release/app/Superlemon.app \
            "dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip"

      - name: Upload signed notarized artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64
          path: |
            dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip
            dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip.sha256
            dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip.notarization.json
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip" \
            "dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip.sha256" \
            "dist-release/Superlemon-${{ needs.build-test-package.outputs.version }}-macOS-arm64.zip.notarization.json" \
            --verify-tag \
            --generate-notes \
            --title "Superlemon ${{ needs.build-test-package.outputs.version }}"

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/superlemon.keychain-db" || true
